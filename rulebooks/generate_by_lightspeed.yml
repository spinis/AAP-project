---
- name: Red Hat Lightspeed 지능형 자율 복구 (No-Logic Playbook)
  hosts: "{{ target_host | default('all') }}"
  become: yes
  vars:
    # EDA로부터 전달받은 불특정 에러 메시지
    error_context: "{{ detected_error }}"

  tasks:
    - name: "[Lightspeed] 사고 문맥 분석 및 실시간 복구 전략 수립"
      # 여기서 Lightspeed 서비스가 로그를 분석하고 최적의 Ansible 모듈 세트를 결정합니다.
      ansible.builtin.debug:
        msg: "분석 중인 로그: {{ error_context }}"

    - name: "[Lightspeed] 복구 코드(Action) 자동 생성"
      # 이 단계에서 Lightspeed는 Red Hat 지식 베이스를 바탕으로 
      # 'module'과 'args'라는 변수를 동적으로 생성하여 플레이북에 주입합니다.
      ansible.builtin.set_fact:
        # (실제 환경) Lightspeed API로부터 수신된 결과값
        # (시뮬레이션) AI가 로그를 읽고 스스로 판단한 모듈과 인자
        lightspeed_remediation: "{{ ai_generated_result }}" 

    - name: "[Lightspeed] 지능형 복구 태스크 즉시 실행"
      # 플레이북 제작자는 이 모듈이 무엇이 될지 미리 알 필요가 없습니다.
      # Lightspeed가 결정한 모듈과 인자를 그대로 실행(Action)합니다.
      ansible.builtin.action:
        module: "{{ lightspeed_remediation.module }}"
      args: "{{ lightspeed_remediation.args }}"

    - name: "[Lightspeed] 인프라 복원력(Resilience) 확보 확인"
      ansible.builtin.debug:
        msg: "Lightspeed가 생성한 조치를 통해 시스템이 성공적으로 복구되었습니다."
