---
- name: Red Hat Lightspeed Proactive Remediation
  # EDA로부터 전달받은 호스트에 적용
  hosts: "{{ target_host | default('all') }}"
  become: yes
  vars:
    # EDA로부터 전달받은 불특정 에러 메시지
    error_context: "{{ detected_error }}"

  tasks:
    - name: "[Lightspeed] 시스템 상태 및 구성 분석"
      ansible.builtin.debug:
        msg: "Red Hat Lightspeed가 '{{ error_context }}' 로그의 문맥을 분석 중입니다."

    - name: "[Lightspeed] 최적의 복구 워크플로우 식별"
      ansible.builtin.debug:
        msg: "하이브리드 클라우드 환경의 효율성을 위해 최적화된 복구 코드를 생성합니다."

    # 여기서부터는 Lightspeed가 실시간으로 생성한 코드가 실행되는 단계입니다.
    # 시연을 위해 로그의 핵심 단어를 읽어 '동적'으로 대응하는 구조입니다.
    - name: "[Lightspeed] 실시간 복구 코드(Task) 생성 및 실행"
      ansible.builtin.action:
        module: "{{ 'ansible.builtin.service' if 'service' in error_context or 'httpd' in error_context else 'ansible.builtin.shell' }}"
      args:
        # 로그 내용에 따라 적절한 인자를 Lightspeed가 판단하여 주입하는 것을 모사
        name: "{{ 'httpd' if 'httpd' in error_context else omit }}"
        state: "{{ 'restarted' if 'httpd' in error_context else omit }}"
        cmd: "{{ 'sync; echo 3 > /proc/sys/vm/drop_caches' if 'memory' in error_context else omit }}"
      register: lightspeed_result

    - name: "[Lightspeed] 조치 결과 모니터링 및 보고"
      ansible.builtin.debug:
        msg: "Lightspeed가 시스템의 복원력(Resilience)을 확보했습니다. 조치 완료: {{ lightspeed_result.changed }}"
