---
- name: "RHEL 10 Self-Healing Rulebook"
  hosts: all
  sources:
    - ansible.eda.webhook:
        host: 0.0.0.0
        port: 5000
  rules:
    - name: "Detect Nginx Down"
      condition: event.payload.status == "down"
      action:
        # 예시로, Nginx를 재시작하는 Ansible 플레이북을 실행
        run_job_template:
          name: "Managed-Recovery-Service"  # AAP에 등록된 템플릿 이름
          organization: "Default"        # AAP의 조직 이름