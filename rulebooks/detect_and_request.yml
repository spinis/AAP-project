- name: 불특정 시스템 장애 감지 및 Lightspeed 호출
  hosts: all
  sources:
    - ansible.eda.tail:
        path: /var/log/messages
  rules:
    - name: "에러 로그 발견 시 Lightspeed 조치 템플릿 실행"
      condition: event.line search("error|fail|panic", ignorecase=true)
      action:
        # run_playbook 대신 run_job_template 사용
        run_job_template:
          name: "AI-Remediation-via-Lightspeed"  # AAP에 등록된 템플릿 이름
          organization: "Default"                # 소속 조직 이름
          job_args:
            extra_vars:
              detected_error: "{{ event.line }}"
