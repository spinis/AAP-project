---
- name: Red Hat Lightspeed 지능형 장애 복구 루틴
  hosts: all
  sources:
    - ansible.eda.webhook:
        port: 5002  # 사용 중인 포트를 피해 5002로 설정
  rules:
    - name: "시스템 장애 감지 시 Lightspeed 자동 조치 트리거"
      # 웹훅으로 들어오는 데이터는 event.payload 구조를 가집니다.
      condition: event.payload.message is search("error|fail|panic|down|crit|drop|oom", ignorecase=true)
      action:
        run_job_template:
          name: "Lightspeed_Remediation_Job"
          organization: "Default"
          job_args:
            extra_vars:
              detected_error: "{{ event.payload.message }}"
              target_host: "rh93-hb01"
