---
- name: RHEL AI 지능형 장애 분석 및 SOS리포트 자동화
  hosts: all
  vars:
    ai_server_ip: "172.30.1.228"
    report_path: "/var/tmp"

  tasks:
    - name: 1. 시스템 로그에서 실제 커널 OOM 메시지만 추출
      # 1. dmesg 대신 /var/log/messages에서 찾습니다. (logger로 심은 건 여기로 갑니다)
      # 2. 앤서블 실행 기록(python)은 확실히 제외합니다.
      ansible.builtin.shell: "egrep -i 'out of memory|oom' /var/log/messages | grep -Ev 'python|ansible'"
      become: yes
      register: oom_result
      failed_when: false

    - name: 2. Granite AI에게 분석 및 복구 코드 생성 요청
      ansible.builtin.uri:
        url: "http://{{ ai_server_ip }}:11434/api/generate"
        method: POST
        body_format: json
        body:
          model: "granite3-dense:2b"
          prompt: |
            당신은 Red Hat 기술지원 엔지니어이자 Ansible 전문가입니다. 
            제공된 로그를 바탕으로 '장애 진단 보고서'를 작성하세요. 
            반드시 한국어를 사용하고, 아래의 4단계 형식을 엄격히 준수하세요.

            [장애 진단 보고서]

            1. 원인 분석:
            - (여기에 커널이 왜 해당 프로세스를 종료했는지 한 줄로 설명)

            2. 탐지 내용:
            - 대상 프로세스: (프로세스명)
            - 로그 분석: (점수 및 마스크 정보를 포함한 기술적 해석)

            3. 권장 조치 방안:
            - (시스템 환경 최적화 및 설정 변경 제안)

            4. 자동 복구 코드 (Ansible Task):
            ```yaml
            - name: Recovery Action
              (여기에 서비스 재시작 또는 캐시 비우기 등의 실질적인 Ansible 태스크 코드를 작성)
            ```
            [Log] {{ oom_result.stdout }}
          stream: false
        timeout: 300
      register: ai_response
      # 조건 완화: oom_result 변수가 정의만 되어 있으면 일단 AI에게 물어봅니다.
      when: oom_result.stdout is defined and oom_result.stdout != ""

    - name: 3. *** AI 지능형 분석 결과 출력 ***
      ansible.builtin.debug:
        msg: 
          - "---------------------------------------------------------------"
          - "🤖 AI 진단 완료: {{ ai_response.json.response | default('분석 실패') }}"
          - "---------------------------------------------------------------"
      when: ai_response.json is defined

    - name: 4. AI 분석 내용을 텍스트 파일로 저장
      ansible.builtin.copy:
        # 파일 내용: 분석 시간, 원본 로그, AI 분석 결과
        content: |
          [OOM 분석 리포트]
          분석 시간: {{ ansible_date_time.iso8601 }}
          대상 서버: {{ inventory_hostname }}
          원본 로그: {{ oom_result.stdout }}
          ---------------------------------------------------------------
          [AI 분석 결과]
          {{ ai_response.json.response }}
        # 파일명 형식: oom-report-2026-03-15.txt
        dest: "{{ report_path }}/oom-report-{{ ansible_date_time.date }}.txt"
        mode: '0644'
      when: ai_response.json is defined
      become: yes

    - name: 5. sosreport 생성 (정밀 진단용)
      ansible.builtin.shell: "sos report --batch --tmp-dir {{ report_path }} --name OOM_Analysis"
      register: sos_result
      when: ai_response.json is defined
      become: yes

    - name: 6. 📂 최종 리포트 저장 위치 안내
      ansible.builtin.debug:
        msg: 
          - "✅ 모든 분석 리포트 생성이 완료되었습니다."
          - "📄 AI 리포트: {{ report_path }}/oom-report-{{ ansible_date_time.date }}.txt"
          - "📦 sos리포트: {{ report_path }}/{{ sos_result.stdout_lines[-1] | default('확인 필요') }}"
          - "---------------------------------------------------------------"
      when: ai_response.json is defined
