---
- name: RHEL AI 지능형 장애 분석 및 SOS리포트 자동화
  hosts: all
  vars:
    ai_server_ip: "172.30.1.228"
    report_path: "/var/tmp"

  tasks:
    - name: 1. 시스템 로그에서 OOM 메시지 검색
      # 'tail -n 100'으로 최근 로그 100줄 중 마지막 OOM을 찾고, '-i'로 대소문자 무시
      ansible.builtin.shell: "grep -i 'out of memory' /var/log/messages"
      register: oom_result
      ignore_errors: yes

    - name: 2. Granite AI에게 분석 요청 (OOM 감지 시에만)
      ansible.builtin.uri:
        url: "http://{{ ai_server_ip }}:11434/api/generate"
        method: POST
        body_format: json
        body:
          model: "granite3-dense:2b"
          prompt: "Analyze this OOM log and explain in Korean briefly: {{ oom_result.stdout }}"
          stream: false
        timeout: 120
      register: ai_response
      when: 
        - oom_result.stdout is defined
        - oom_result.stdout != ""
        - "'Out of memory' in oom_result.stdout"

    - name: 3. sosreport 생성 (배치 모드)
      # --batch 옵션으로 자동 승인, --tmp-dir로 저장 위치 지정
      ansible.builtin.shell: "sos report --batch --tmp-dir {{ report_path }} --name OOM_Analysis"
      register: sos_result
      when: ai_response.skipped is not defined or not ai_response.skipped
      become: yes

    - name: 4. ✨ 최종 리포트 출력 ✨
      ansible.builtin.debug:
        msg: 
          - "---------------------------------------------------------------"
          - "⚠️  OOM이 발견되었습니다! 분석 내용과 sos리포트를 확인하세요."
          - "🤖 AI 분석 요약 : {{ ai_response.json.response | default('분석 실패') }}"
          - "📂 sos리포트 저장 위치 : {{ report_path }}"
          - "📄 생성 파일명 : {{ sos_result.stdout_lines[-1] | default('확인 필요') }}"
          - "---------------------------------------------------------------"
      when: ai_response.skipped is not defined or not ai_response.skipped
