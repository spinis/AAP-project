---
- name: OOM 장애 분석 및 AI 리포트 생성
  hosts: all
  become: yes
  vars:
    # Ollama가 설치된 VM의 IP (localhost라면 127.0.0.1)
    ai_server_ip: "172.30.1.228" 

  tasks:
    - name: 1. 시스템 로그에서 OOM 관련 핵심 추출
      ansible.builtin.shell: "grep -i 'out of memory' /var/log/messages | tail -n 1"
      register: oom_result
      ignore_errors: yes

    - name: 2. Granite AI model 에게 분석 요청
      ansible.builtin.uri:
        url: "http://{{ ai_server_ip | string }}:11434/api/generate"
        method: POST
        body_format: json
        body:
          model: "granite3-dense:2b"
          prompt: |
            Analyze this log and explain in Korean: {{ oom_result.stdout | default('N/A') }}
          stream: false
        timeout: 300
      register: ai_response
      # 핵심 수정: 변수가 '정의되어 있고' + '비어있지 않을 때'만 실행
      when: 
        - oom_result is defined
        - oom_result.stdout is defined
        - oom_result.stdout != ""

    - name: 3. 로그가 없을 경우 메시지 출력
      ansible.builtin.debug:
        msg: "AI 분석 결과: {{ ai_response.json.response }}"
      when: ai_response is defined and ai_response.json is defined

    - name: 4. AI 분석 결과 요약 출력
      set_stats:
        data:
          ai_insight: "{{ ai_response.json.response }}"

    - name: 5. 최종 리포트 출력 (로그 확인용)
      debug:
        msg: "{{ ai_response.json.response }}"
