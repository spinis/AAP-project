---
- name: RHEL AI 지능형 장애 분석 및 SOS리포트 자동화
  hosts: all
  vars:
    ai_server_ip: "172.30.1.228"
    report_path: "/var/tmp"

  tasks:
    - name: 1. 시스템 로그에서 실제 커널 OOM 메시지만 추출
      ansible.builtin.shell: "dmesg | grep -i 'out of memory' | tail -n 1"
      become: yes
      register: oom_result
      ignore_errors: yes

    - name: 2. Granite AI에게 분석 요청
      ansible.builtin.uri:
        url: "http://{{ ai_server_ip }}:11434/api/generate"
        method: POST
        body_format: json
        body:
          model: "granite3-dense:2b"
          prompt: "Analyze OOM log briefly in Korean: {{ oom_result.stdout | truncate(200) }}"
          stream: false
        timeout: 300
      register: ai_response
      when: oom_result.stdout is defined and oom_result.stdout != ""

    - name: 3. *** AI 지능형 분석 결과 출력 ***
      ansible.builtin.debug:
        msg: 
          - "---------------------------------------------------------------"
          - "🤖 AI 진단 완료: {{ ai_response.json.response | default('분석 실패') }}"
          - "---------------------------------------------------------------"
      when: ai_response.json is defined

    - name: 4. AI 분석 내용을 텍스트 파일로 저장
      ansible.builtin.copy:
        # 파일 내용: 분석 시간, 원본 로그, AI 분석 결과
        content: |
          [OOM 분석 리포트]
          분석 시간: {{ ansible_date_time.iso8601 }}
          대상 서버: {{ inventory_hostname }}
          원본 로그: {{ oom_result.stdout }}
          ---------------------------------------------------------------
          [AI 분석 결과]
          {{ ai_response.json.response }}
        # 파일명 형식: oom-report-2026-03-15.txt
        dest: "{{ report_path }}/oom-report-{{ ansible_date_time.date }}.txt"
        mode: '0644'
      when: ai_response.json is defined
      become: yes

    - name: 5. sosreport 생성 (정밀 진단용)
      ansible.builtin.shell: "sos report --batch --tmp-dir {{ report_path }} --name OOM_Analysis"
      register: sos_result
      when: ai_response.json is defined
      become: yes

    - name: 6. 📂 최종 리포트 저장 위치 안내
      ansible.builtin.debug:
        msg: 
          - "✅ 모든 분석 리포트 생성이 완료되었습니다."
          - "📄 AI 리포트: {{ report_path }}/oom-report-{{ ansible_date_time.date }}.txt"
          - "📦 sos리포트: {{ report_path }}/{{ sos_result.stdout_lines[-1] | default('확인 필요') }}"
          - "---------------------------------------------------------------"
      when: ai_response.json is defined
